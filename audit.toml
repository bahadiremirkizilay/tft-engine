# Accept list for `tft-engine audit`.
#
# Every entry needs a key (as the audit prints it), a kind and a reason.
#   debt          a known problem: stays in the report as DEBT until it is fixed
#   setting       a solver or run setting, not a game value or a model number
#   technical     part of an algorithm (hash constants, ordering, loop guards)
#   not_modelled  data recorded on purpose that no code uses yet
#   experimental  code kept outside the CLI on purpose
#   tool_only     used only by tools/
# An entry that no longer matches a finding is reported, so this list cannot go stale.

[stats]
# item_fit derives "mana_effect" from an item's effect text; items have no such stat
fit_only_keys = ["mana_effect"]

[assumptions]
# written before the basis field existed; give each a basis over time (new ones need one)
legacy_without_basis = [
    "horizon_rounds",
    "roll_floor",
    "unit_power_cost_exp",
    "star_mult_2",
    "star_mult_3",
    "comp_complete_bonus",
    "win_prob_slope",
    "opp_strength_scale",
    "damage_scale",
    "pool_depletion_scale",
    "elim_penalty_hp",
    "gold_value_hp",
    "excess_gold_value_hp",
    "level_value_hp",
    "future_rounds",
    "surviving_units_on_loss_by_stage",
    "opp_level_by_stage",
    "opp_unit_power_by_stage",
    "tier_taken_frac_by_stage",
    "item_fit_weights",
    "comp_match_weights",
    "sim_trait_bonus",
    "sim_item_bonus",
    "sim_level_curve",
    "sim_low_hp",
    "sim_deep_roll_floor",
    "sim_item_good_fit",
    "sim_item_min_fit",
    "sim_lose_streak_hp",
    "sim_rolldown_floor",
    "sim_excess_gold",
    "sim_trait_progress",
    "sim_shop_trait_weight",
    "sim_carousel_round",
    "sim_carry_needs_items_value",
    "sim_idle_holder_factor",
    "power_fight_seconds",
    "power_mana_per_attack",
    "power_ability_base",
    "power_ability_star",
    "power_tank_ability_share",
    "power_resist_weight",
    "build_cost_caps",
    "build_stars",
    "build_item_slots",
    "wisp_price",
]

# --- settings and technical constants ------------------------------------------------

[[accept]]
key = "decision/evaluate.py:MAX_BELIEF_STATES"
kind = "setting"
reason = "solver size limit; above it the evaluator samples instead of enumerating"

[[accept]]
key = "decision/evaluate.py:MC_SAMPLES"
kind = "setting"
reason = "Monte Carlo sample count (accuracy setting)"

[[accept]]
key = "gamedata/hashes.py:_FNV_OFFSET"
kind = "technical"
reason = "FNV-1a hash constant used by the game files"

[[accept]]
key = "gamedata/hashes.py:_FNV_PRIME"
kind = "technical"
reason = "FNV-1a hash constant used by the game files"

[[accept]]
key = "prob/sampler.py:wilson_ci()"
kind = "technical"
reason = "z value of a 95% confidence interval"

[[accept]]
key = "experiments/examples.py:toy_dice_mean()"
kind = "technical"
reason = "toy experiment that tests the run log; no TFT mechanics"

[[accept]]
key = "rules/economy.py:_MAX_EVENT_DEPTH"
kind = "technical"
reason = "guard against events that trigger each other forever"

[[accept]]
key = "rules/modifiers.py:_OP_ORDER"
kind = "technical"
reason = "fixed order of modifier operations (set, add, mul, min/max)"

[[accept]]
key = "state/game_state.py:_OPTIONAL_DEFAULTS"
kind = "technical"
reason = "empty defaults of optional state fields"

[[accept]]
key = "prob/shop_model.py:from_gamedata()"
kind = "technical"
reason = "0.5 is the data rule every_other_shop written as a probability"

# --- data recorded on purpose, not used by code yet ----------------------------------

[[accept]]
key = "param:inferno_upgrade"
kind = "not_modelled"
reason = "the roll solver already counts the shown shop; open questions in the param note"

[[accept]]
key = "param:shop_holds_copies"
kind = "not_modelled"
reason = "owner's shop rule (07f551d); needs an opponent-shop belief layer"

[[accept]]
key = "param:bad_luck_protection"
kind = "not_modelled"
reason = "value is false: no such field in the Set 18 game file"

